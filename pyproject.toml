[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlbiosig"
version = "0.1.0"
description = "A machine learning pipeline for biosignature detection in icy ocean world analogue py-GC-MS data across biotic and abiotic samples, developed in the context of astrobiology space mission instruments such as NASA Europa Clipper's MASPEX."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Gabriella Mariam Zahra Rajpoot", email = "Gabriella.Rajpoot24@imperial.ac.uk" }
]
license = { text = "BSD 3-Clause License" }
keywords = [
    "astrobiology",
    "biosignature",
    "mass spectrometry",
    "pyrolysis",
    "machine learning",
    "Europa",
    "MASPEX",
    "py-GC-MS",
    "icy ocean worlds"
]
dependencies = [
    "numpy>=1.25",
    "pandas>=2.0",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "imbalanced-learn>=0.11",
    "scikit-optimize>=0.9",
    "shap>=0.44",
    "tqdm>=4.60"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build>=1.0",
    "black",
    "ruff",
    "nbqa",
    "jupyterlab"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mlbiosig*"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.ruff]
line-length = 88